[project]
name = "ava-live-mcp"
version = "1.0.0"
description = "Servidor MCP para controlar Ableton Live y producir canciones con Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
ava-live-mcp = "ava_live_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ava_live_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src", "remote_script"]
testpaths = ["tests"]
